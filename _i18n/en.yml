    title: International transport, agricultural and construction machinery
    about-1: Our main domain is the transportation of cargo within the European Union. We are happy to undertake transports to other countries, according to the wishes of the client. The goods are insured with a carrier's liability policy in international and national traffic. We have trailers for transporting agricultural and construction machinery.
    about-2: Our company aims to provide a full range of services in the field of national and international road transport. Transport services and freight forwarding are our specialty and passion! In our activities, we are reliable, enjoying recognition and trust from clients both at home and abroad. We focus on quality!
    about-3: We fulfill orders from both large enterprises and small companies. For us, an individual approach to the services provided matters. We are here for you every day!
    about-4: We are aware of the challenges that come with transporting heavy equipment, which is why we execute each order with the utmost care and precision, ensuring safety and timely deliveries. In the field of oversized transport, we focus on the transportation of large construction, military, and agricultural machinery.
